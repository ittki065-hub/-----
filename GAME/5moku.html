<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>10x10 5目並べゲーム</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background-color: #f7f9fc;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95vh;
        }
        h1 {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 5px;
        }
        #status {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #34495e;
        }
        /* 画面外にはみ出た場合にスクロールできるようにするエリア */
        .board-container {
            max-width: 100%;
            max-height: 60vh;
            overflow: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: #bdc3c7;
            padding: 8px;
            margin-bottom: 20px;
            -webkit-overflow-scrolling: touch; /* スマホで滑らかにスクロール */
        }
        .board {
            display: grid;
            /* 10×10マス（1マス42px） */
            grid-template-columns: repeat(10, 42px);
            grid-template-rows: repeat(10, 42px);
            gap: 4px;
        }
        .cell {
            background-color: white;
            border: none;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
            -webkit-tap-highlight-color: transparent;
            padding: 0;
        }
        .cell:active {
            background-color: #ecf0f1;
        }
        .cell.x { color: #e74c3c; }
        .cell.o { color: #3498db; }
        #reset-btn {
            font-size: 16px;
            padding: 10px 25px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.3);
        }
        #reset-btn:active {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <h1>10×10 5目並べゲーム</h1>
    <div id="status">ターン: 〇</div>

    <div class="board-container">
        <div class="board" id="board"></div>
    </div>

    <button id="reset-btn" onclick="resetGame()">リセット</button>

    <script>
        const BOARD_SIZE = 10;
        const WIN_COUNT = 5;
        let board = Array(BOARD_SIZE * BOARD_SIZE).fill("");
        let currentPlayer = "〇";
        let isGameOver = false;

        const boardElement = document.getElementById('board');

        // JavaScriptで100個のボタンを自動生成
        function createBoard() {
            boardElement.innerHTML = "";
            for (let i = 0; i < BOARD_SIZE * BOARD_SIZE; i++) {
                const btn = document.createElement('button');
                btn.className = 'cell';
                btn.setAttribute('data-index', i);
                btn.addEventListener('click', () => makeMove(i, btn));
                boardElement.appendChild(btn);
            }
        }

        function makeMove(index, cell) {
            if (board[index] !== "" || isGameOver) return;

            board[index] = currentPlayer;
            cell.innerText = currentPlayer;
            cell.classList.add(currentPlayer === "〇" ? "o" : "x");

            if (checkWinner(currentPlayer)) {
                document.getElementById("status").innerText = `プレイヤー ${currentPlayer} の勝ち！🎉`;
                isGameOver = true;
                return;
            }

            if (!board.includes("")) {
                document.getElementById("status").innerText = "引き分けです！";
                isGameOver = true;
                return;
            }

            currentPlayer = currentPlayer === "〇" ? "✕" : "〇";
            document.getElementById("status").innerText = `ターン: ${currentPlayer}`;
        }

        function checkWinner(player) {
            const size = BOARD_SIZE;
            const target = WIN_COUNT;

            // 横方向
            for (let r = 0; r < size; r++) {
                for (let c = 0; c <= size - target; c++) {
                    let win = true;
                    for (let i = 0; i < target; i++) {
                        if (board[r * size + (c + i)] !== player) { win = false; break; }
                    }
                    if (win) return true;
                }
            }

            // 縦方向
            for (let c = 0; c < size; c++) {
                for (let r = 0; r <= size - target; r++) {
                    let win = true;
                    for (let i = 0; i < target; i++) {
                        if (board[(r + i) * size + c] !== player) { win = false; break; }
                    }
                    if (win) return true;
                }
            }

            // 斜め（右下がり）
            for (let r = 0; r <= size - target; r++) {
                for (let c = 0; c <= size - target; c++) {
                    let win = true;
                    for (let i = 0; i < target; i++) {
                        if (board[(r + i) * size + (c + i)] !== player) { win = false; break; }
                    }
                    if (win) return true;
                }
            }

            // 斜め（右上がり）
            for (let r = target - 1; r < size; r++) {
                for (let c = 0; c <= size - target; c++) {
                    let win = true;
                    for (let i = 0; i < target; i++) {
                        if (board[(r - i) * size + (c + i)] !== player) { win = false; break; }
                    }
                    if (win) return true;
                }
            }

            return false;
        }

        function resetGame() {
            board = Array(BOARD_SIZE * BOARD_SIZE).fill("");
            currentPlayer = "〇";
            isGameOver = false;
            document.getElementById("status").innerText = `ターン: ${currentPlayer}`;
            createBoard();
        }

        // 初期化実行
        createBoard();
    </script>
</body>
</html>
