<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>横スクロールシューティング</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            font-family: -apple-system, sans-serif;
            background-color: #090d16;
            color: white;
            margin: 0;
            padding: 5px;
            text-align: center;
        }
        header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        #score-board {
            font-size: 14px;
            color: #38bdf8;
            margin-bottom: 6px;
        }
        canvas {
            background-color: #050811;
            border: 2px solid #38bdf8;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }
        /* スマホ用コントローラーレイアウト */
        .controller {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 360px;
            margin: 10px auto 0;
            padding: 0 10px;
        }
        /* 十字キー */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 42px);
            grid-template-rows: repeat(3, 42px);
            gap: 2px;
        }
        .btn-pad {
            background-color: #1e293b;
            color: white;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
        }
        .btn-pad:active { background-color: #38bdf8; color: #000; }
        /* 攻撃ボタン */
        .btn-fire {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #ef4444;
            border: 3px solid #f87171;
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
        }
        .btn-fire:active { background-color: #dc2626; transform: scale(0.95); }
        .btn-reset {
            margin-top: 10px;
            background-color: #475569;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>🚀 SIDE SHOOTER</header>
    <div id="score-board">SCORE: <span id="score">0</span> | HP: <span id="hp">❤❤❤</span></div>

    <canvas id="gameCanvas" width="360" height="240"></canvas>

    <!-- コントローラー -->
    <div class="controller">
        <!-- 十字キー -->
        <div class="dpad">
            <div></div>
            <div class="btn-pad" id="btn-up">▲</div>
            <div></div>
            <div class="btn-pad" id="btn-left">◀</div>
            <div></div>
            <div class="btn-pad" id="btn-right">▶</div>
            <div></div>
            <div class="btn-pad" id="btn-down">▼</div>
            <div></div>
        </div>
        <!-- 攻撃ボタン -->
        <div class="btn-fire" id="btn-fire">FIRE</div>
    </div>

    <button class="btn-reset" onclick="initGame()">リトライ</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let hp = 3;
        let gameOver = false;
        let frameCount = 0;

        // 自機
        const player = {
            x: 20,
            y: canvas.height / 2 - 10,
            width: 24,
            height: 16,
            speed: 3
        };

        // 移動状態フラグ
        const moveState = {
            up: false,
            down: false,
            left: false,
            right: false
        };

        let bullets = [];
        let enemies = [];
        let stars = [];

        // 星背景の初期化
        for (let i = 0; i < 30; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: Math.random() * 1.5 + 0.5,
                size: Math.random() * 1.5 + 0.5
            });
        }

        function initGame() {
            score = 0;
            hp = 3;
            gameOver = false;
            frameCount = 0;
            player.x = 20;
            player.y = canvas.height / 2 - 10;
            bullets = [];
            enemies = [];
            moveState.up = false;
            moveState.down = false;
            moveState.left = false;
            moveState.right = false;
            updateUI();
            requestAnimationFrame(update);
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('hp').innerText = '❤'.repeat(Math.max(0, hp));
        }

        // キーボード操作（PC用）
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') moveState.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') moveState.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') moveState.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') moveState.right = true;
            if (e.key === ' ' || e.key === 'z') fireBullet();
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') moveState.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') moveState.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') moveState.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') moveState.right = false;
        });

        // ボタン長押しタッチ操作（スマホ用）
        function setupButton(id, dir) {
            const btn = document.getElementById(id);
            
            const start = (e) => {
                e.preventDefault();
                moveState[dir] = true;
            };
            const end = (e) => {
                e.preventDefault();
                moveState[dir] = false;
            };

            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('touchcancel', end);

            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        }

        setupButton('btn-up', 'up');
        setupButton('btn-down', 'down');
        setupButton('btn-left', 'left');
        setupButton('btn-right', 'right');

        // 攻撃ボタン
        const btnFire = document.getElementById('btn-fire');
        btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); fireBullet(); });
        btnFire.addEventListener('mousedown', (e) => { e.preventDefault(); fireBullet(); });

        function fireBullet() {
            if (gameOver) return;
            bullets.push({
                x: player.x + player.width,
                y: player.y + player.height / 2 - 2,
                width: 10,
                height: 4,
                speed: 6
            });
        }

        function spawnEnemy() {
            const size = Math.random() * 10 + 16;
            enemies.push({
                x: canvas.width,
                y: Math.random() * (canvas.height - size),
                width: size,
                height: size,
                speed: Math.random() * 2 + 1.5,
                hp: size > 22 ? 2 : 1
            });
        }

        function update() {
            if (gameOver) return;

            frameCount++;

            // 移動処理
            if (moveState.up) player.y -= player.speed;
            if (moveState.down) player.y += player.speed;
            if (moveState.left) player.x -= player.speed;
            if (moveState.right) player.x += player.speed;

            // 画面外制御
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;

            // 星背景スクロール
            stars.forEach(s => {
                s.x -= s.speed;
                if (s.x < 0) s.x = canvas.width;
            });

            // 弾の移動
            bullets.forEach((b, index) => {
                b.x += b.speed;
                if (b.x > canvas.width) bullets.splice(index, 1);
            });

            // 敵の出現
            if (frameCount % 40 === 0) spawnEnemy();

            // 敵の移動と判定
            for (let eIndex = enemies.length - 1; eIndex >= 0; eIndex--) {
                const e = enemies[eIndex];
                e.x -= e.speed;

                if (e.x + e.width < 0) {
                    enemies.splice(eIndex, 1);
                    continue;
                }

                // 自機との衝突
                if (player.x < e.x + e.width &&
                    player.x + player.width > e.x &&
                    player.y < e.y + e.height &&
                    player.y + player.height > e.y) {
                    
                    enemies.splice(eIndex, 1);
                    hp--;
                    updateUI();
                    if (hp <= 0) gameOver = true;
                    continue;
                }

                // 弾との命中
                for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
                    const b = bullets[bIndex];
                    if (b.x < e.x + e.width &&
                        b.x + b.width > e.x &&
                        b.y < e.y + e.height &&
                        b.y + b.height > e.y) {
                        
                        bullets.splice(bIndex, 1);
                        e.hp--;
                        if (e.hp <= 0) {
                            enemies.splice(eIndex, 1);
                            score += 10;
                            updateUI();
                            break;
                        }
                    }
                }
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 星
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            // 自機
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width, player.y + player.height / 2);
            ctx.lineTo(player.x, player.y);
            ctx.lineTo(player.x + 5, player.y + player.height / 2);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // 弾
            ctx.fillStyle = '#facc15';
            bullets.forEach(b => {
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            // 敵機
            enemies.forEach(e => {
                ctx.fillStyle = e.hp > 1 ? '#a855f7' : '#ef4444';
                ctx.fillRect(e.x, e.y, e.width, e.height);
            });

            // ゲームオーバー表示
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = '#ffffff';
                ctx.font = '14px sans-serif';
                ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
            }
        }

        initGame();
    </script>
</body>
</html>
